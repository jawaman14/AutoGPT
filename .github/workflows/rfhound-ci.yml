name: RFHound CI

# Scoped to the rfhound/ toolkit so it never runs on unrelated AutoGPT changes.
on:
  push:
    paths:
      - "rfhound/**"
      - ".github/workflows/rfhound-ci.yml"
  pull_request:
    paths:
      - "rfhound/**"
      - ".github/workflows/rfhound-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    defaults:
      run:
        working-directory: rfhound
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: flake8 rfhound --max-line-length=110 --extend-ignore=E203,W503
      - name: Test
        run: pytest -q
