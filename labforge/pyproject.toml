[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labforge"
version = "0.1.0"
description = "XDL-native, ESP32-driven, 3D-printable lab automation suite."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LabForge contributors" }]
keywords = [
    "chemistry",
    "lab-automation",
    "esp32",
    "3d-printing",
    "xdl",
    "self-driving-lab",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# The core suite is intentionally dependency-light so it runs anywhere,
# including in pure-simulation mode with no hardware attached.
dependencies = []

[project.optional-dependencies]
# Serial transport to a physical ESP32 controller.
serial = ["pyserial>=3.5"]
# Optional cheminformatics: reagent lookup, molar-mass / stoichiometry.
chem = ["rdkit>=2023.3.1"]
# Networked (WiFi/MQTT) transport to the ESP32.
mqtt = ["paho-mqtt>=1.6"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["pyserial>=3.5", "rdkit>=2023.3.1", "paho-mqtt>=1.6"]

[project.scripts]
labforge = "labforge.cli:main"

[project.urls]
Homepage = "https://github.com/jawaman14/AutoGPT/tree/main/labforge"
Documentation = "https://github.com/jawaman14/AutoGPT/tree/main/labforge/docs"

[tool.setuptools.packages.find]
where = ["software"]

[tool.pytest.ini_options]
testpaths = ["software/tests"]
addopts = "-q"
