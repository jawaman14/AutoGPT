; PlatformIO project for the LabForge ESP32 controller.
;
;   pio run                 # build
;   pio run -t upload       # flash over USB
;   pio device monitor      # open a serial monitor (115200 baud)
;
; The firmware speaks the LabForge line protocol (see
; software/labforge/transport/protocol.py and firmware/esp32/README.md).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D LABFORGE_FW_VERSION=\"0.1.0\"
lib_deps =
    waspinator/AccelStepper @ ^1.64
